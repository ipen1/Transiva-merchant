name: Build Transiva Merchant Signed Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Decode release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::GitHub Secret KEYSTORE_BASE64 belum tersedia."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/transiva-release.jks
          test -s app/transiva-release.jks

      - name: Validate signing secrets
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_PASSWORD:-}" || { echo "::error::KEYSTORE_PASSWORD kosong"; exit 1; }
          test -n "${KEY_ALIAS:-}" || { echo "::error::KEY_ALIAS kosong"; exit 1; }
          test -n "${KEY_PASSWORD:-}" || { echo "::error::KEY_PASSWORD kosong"; exit 1; }

      # Release artifact must not be blocked by pre-existing Android Lint debt.
      # Unit tests remain a blocking quality gate. APK/AAB compilation + signing
      # are also blocking. Lint is executed separately below and its report is
      # uploaded for cleanup without making a valid signed release disappear.
      - name: Build signed release APK and AAB
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --version
          gradle clean testReleaseUnitTest assembleRelease bundleRelease \
            --no-daemon --stacktrace --warning-mode all

      - name: Run Android Lint audit
        id: lint
        continue-on-error: true
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle lintRelease --no-daemon --stacktrace --warning-mode all 2>&1 | tee lint-console.log

      - name: Upload Lint diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: transiva-merchant-lint-report
          path: |
            lint-console.log
            app/build/reports/lint-results-release.html
            app/build/reports/lint-results-release.xml
            app/build/reports/lint-results-release.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify release outputs
        shell: bash
        run: |
          set -euo pipefail
          compgen -G 'app/build/outputs/apk/release/*.apk' > /dev/null || { echo "::error::Release APK tidak ditemukan"; exit 1; }
          compgen -G 'app/build/outputs/bundle/release/*.aab' > /dev/null || { echo "::error::Release AAB tidak ditemukan"; exit 1; }
          ls -lh app/build/outputs/apk/release/*.apk
          ls -lh app/build/outputs/bundle/release/*.aab

      - name: Upload Merchant APK
        uses: actions/upload-artifact@v7
        with:
          name: transiva-merchant-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Merchant AAB
        uses: actions/upload-artifact@v7
        with:
          name: transiva-merchant-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
