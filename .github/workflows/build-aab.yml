name: Build Transiva Merchant Signed Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Decode release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/transiva-release.jks
          test -s app/transiva-release.jks

      - name: Build signed release APK and AAB
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --version
          gradle clean assembleRelease bundleRelease --no-daemon

      - name: Verify release outputs
        shell: bash
        run: |
          set -euo pipefail
          compgen -G 'app/build/outputs/apk/release/*.apk' > /dev/null
          compgen -G 'app/build/outputs/bundle/release/*.aab' > /dev/null

      - name: Upload Merchant APK
        uses: actions/upload-artifact@v7
        with:
          name: transiva-merchant-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Merchant AAB
        uses: actions/upload-artifact@v7
        with:
          name: transiva-merchant-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
