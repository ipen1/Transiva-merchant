plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.transiva.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.transiva.merchant'
        // Google Play automatic protection requires Android 7.0 (API 24)+.
        minSdk 24
        targetSdk 36
        versionCode 30
        versionName '1.9.30'
        manifestPlaceholders = [merchantMapsApiKey: providers.gradleProperty('merchantMapsApiKey').orElse(providers.environmentVariable('MERCHANT_MAPS_API_KEY')).getOrElse('')]
    }

    signingConfigs {
        release {
            storeFile file("transiva-release.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
            storeType "pkcs12"
        }
    }

    buildTypes {
        debug {
            debuggable true
        }

        release {
            signingConfig signingConfigs.release
            debuggable false
            // Production hardening for Play release.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'io.github.webrtc-sdk:android:144.7559.09'
    testImplementation 'junit:junit:4.13.2'
    implementation 'androidx.activity:activity:1.9.3'

    implementation 'androidx.camera:camera-view:1.4.1'
    implementation 'androidx.camera:camera-lifecycle:1.4.1'
    implementation 'androidx.camera:camera-camera2:1.4.1'
    implementation 'androidx.camera:camera-core:1.4.1'

    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'

    // P1: lifecycle-aware image loading + memory/disk cache.
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // Google Maps SDK, shared with Driver and Customer.
    implementation 'com.google.android.gms:play-services-maps:20.0.0'

    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
}
